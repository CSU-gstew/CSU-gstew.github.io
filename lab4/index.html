<!DOCTYPE html>
<html>
<head>
  <title>Sign Up Page</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<main>
  <h1>Sign Up Form</h1>

  <form id="signupForm" action="welcome.html">

    <label>First Name:</label>
    <input type="text"><br>

    <label>Last Name:</label>
    <input type="text"><br>

    <label>Zip Code:</label>
    <input id="zip" type="text">
    <span id="cityError" class="error"></span><br>

    <div class="locationInfo">
      <p>City: <span id="city"></span></p>
      <p>Latitude: <span id="lat"></span></p>
      <p>Longitude: <span id="long"></span></p>
    </div>

    <label>State:</label>
    <select id="state"></select><br>

    <label>Select County:</label>
    <select id="county"></select><br>

    <label>Desired Username:</label>
    <input id="username" type="text">
    <span id="usernameError"></span><br>

    <label>Password:</label>
    <input id="pwd" type="password">
    <span id="suggestedPwd" class="suggestion"></span><br>

    <label>Type Password Again:</label>
    <input id="pwd2" type="password"><br>

    <div id="formErrors" class="errorBox"></div>

    <button type="submit">Sign Up!</button>

  </form>
</main>

<script src="script.js"></script>

</body>
</html>
