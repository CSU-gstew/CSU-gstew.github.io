<!DOCTYPE html>
<html>
	<head>
		<title> The Seasons </title>
		<meta charset="utf-8" />
		<link href="style.css" rel="stylesheet">
	</head>
	
	<body style="background-color:black">
		
		<header>
			<h1 id = "title">The Seasons</h1>
		</header>
		
		<main>

			<!--first row-->
			<div class = "row">
	
				<figure class = "season_image" >
					<img id = "img_topleft" class = "img" src="https://csumb.space/cst/336/practice/img/spring.png" alt= "spring"/>
					<figcaption style="color:white; font-size:max(2vw, 4vw)">
						Spring
					</figcaption>
				</figure>
				<figure class = "season_image" >
					<img id = "img_topright" class = "img" src="https://csumb.space/cst/336/practice/img/summer.png" alt= "summer"/>
					<figcaption style="color:white; font-size:max(2vw, 4vw)">
						Summer
					</figcaption>
				</figure>
				
			</div>
			
			<!--second row-->
			<div class = row>
				
				<figure class = "season_image">
					<img id = "img_bottomleft" class = "img" src= "https://csumb.space/cst/336/practice/img/fall.png" alt= "fall"/>
					<figcaption style="color:white; font-size:max(2vw, 4vw)">
						Autumn
					</figcaption>
				</figure>
	
				<figure class = "season_image" >
					<img id = "img_bottomright" class = "img" src= "https://csumb.space/cst/336/practice/img/winter.png" alt= "winter"/>
					<figcaption style="color:white; font-size:max(2vw, 4vw)">
						Winter
					</figcaption>
				</figure>
	
			</div>
			
		</main>
		
		<hr style="width:75%; margin-top:20px">
		
		<footer style="font-size:3vw; color:silver;text-align:center; top-padding:10px">
			California State University Monterey Bay
			<br><img style="width:15%" src="https://csumb.space/cst/336/img/csumb_logo.png">
		</footer>

	</body>
</html>
